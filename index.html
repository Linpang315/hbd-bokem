<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday 💗</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
}

body{
background:linear-gradient(135deg,#ffd6e8,#d6f0ff,#e8d6ff);
}

.container{
display:flex;
width:300vw;
height:100vh;
transition:.6s ease;
}

.page{
width:100vw;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-shrink:0;
}

.card{
width:300px;
background:rgba(255,255,255,.9);
border-radius:30px;
padding:20px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,.12);
}

h2{color:#ff7aa2}

button{
border:none;
padding:10px 20px;
border-radius:20px;
background:#ffb3d1;
color:#555;
margin-top:15px;
}

.photo{
margin-top:15px;
width:100%;
height:55vh;
background:#000;
border:8px solid #f3f3f3;
border-bottom:25px solid #f3f3f3;
border-radius:12px;
overflow:hidden;
}

.photo video{
width:100%;
height:100%;
object-fit:cover;
}

p{color:#666;font-size:14px;white-space:pre-line}

.heart{
position:fixed;
bottom:-20px;
font-size:20px;
animation:fly 4s linear forwards;
}

@keyframes fly{
from{transform:translateY(0);opacity:1}
to{transform:translateY(-120vh);opacity:0}
}
</style>
</head>

<body>

<audio autoplay loop>
<source src="music.mp3">
</audio>

<div class="container" id="wrap">

<!-- PAGE 1 -->
<div class="page">
<div class="card">
<h2>🎂 Happy Birthday 🎂<br>Bokem</h2>
<p>ciee tuaa ✨</p>
<button onclick="go(1)">lanjut</button>
</div>
</div>

<!-- PAGE 2 -->
<div class="page">
<div class="card">
<p id="typing1"></p>
<button onclick="go(2)">next</button>
</div>
</div>

<!-- PAGE 3 -->
<div class="page">
<div class="card">

<p id="typing2"></p>

<div class="photo">
<video id="vid" src="video.mp4" controls playsinline onclick="fullVid()"></video>
</div>

<button onclick="love()">🥳</button>

</div>
</div>

</div>

<script>

let wrap=document.getElementById("wrap");
let page=0;

function go(n){
page=n;
wrap.style.transform=`translateX(-${page*100}vw)`;

if(page==1) startTyping1();
if(page==2){
 startTyping2();
 document.getElementById("vid").play();
}
}

// typing 1
let text1="makasih udah bertahan sejauh ini 🥺💗\nmangat terus kemm ✨\nplease stay soft in hard world 🌸";
let i=0;

function startTyping1(){
typing1.innerHTML="";
i=0;
let t=setInterval(()=>{
 typing1.innerHTML+=text1[i]=="\n"?"\n":text1[i];
 i++;
 if(i>=text1.length) clearInterval(t);
},60);
}

// typing 2
let text2="semoga selalu sehat 🥳\nbahagia ✨\ndan semua wishlist pelan-pelan kejadian 💗";
let j=0;

function startTyping2(){
typing2.innerHTML="";
j=0;
let t2=setInterval(()=>{
 typing2.innerHTML+=text2[j]=="\n"?"\n":text2[j];
 j++;
 if(j>=text2.length) clearInterval(t2);
},70);
}

// fullscreen video
function fullVid(){
let v=document.getElementById("vid");
if(v.requestFullscreen) v.requestFullscreen();
else if(v.webkitRequestFullscreen) v.webkitRequestFullscreen();
}

// emoji
function love(){
for(let k=0;k<25;k++){
let h=document.createElement("div");
h.className="heart";
h.innerHTML=["💗","✨","🥳","🌸"][Math.floor(Math.random()*4)];
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);
setTimeout(()=>h.remove(),4000);
}
}

// swipe
let startX=0;
document.addEventListener("touchstart",e=>startX=e.touches[0].clientX);
document.addEventListener("touchend",e=>{
let endX=e.changedTouches[0].clientX;
if(startX-endX>50 && page<2) go(page+1);
if(endX-startX>50 && page>0) go(page-1);
});

</script>

</body>
</html>
